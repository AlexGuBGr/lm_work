name: Release

# CD: a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) runs the full CI
# and then publishes a GitHub release with the architecture diagram and documentation.

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build documentation
        run: |
          pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          python docs/make_architecture.py
          tar czf lm_work-src-${GITHUB_REF_NAME}.tar.gz \
            model.py train.py prepare.py sample.py bench.py evaluate.py requirements.txt NOTES.md README.md
          tar czf tinystories-char-1m-${GITHUB_REF_NAME}.tar.gz -C docs/demo model.json model.bin
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            docs/architecture.png docs/architecture.svg NOTES.md \
            lm_work-src-${GITHUB_REF_NAME}.tar.gz tinystories-char-1m-${GITHUB_REF_NAME}.tar.gz
